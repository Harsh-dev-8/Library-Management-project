<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
    <link rel="stylesheet" href="css/books.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Library</div>
        <div class="nav-links">
            <a href="home.html" class="back-link">Return to Home</a>
        </div>
    </header>

    <main class="container">
        <h1 class="page-title">Books</h1>
        <div class="book-grid" id="bookGrid">
            <p>Loading books...</p>
        </div>
    </main>

    <div class="modal-overlay" id="borrowModal">
        <div class="borrow-modal">
            <h2>Borrow Book</h2>
            <label for="borrowDatetime">Expected Return Date &amp; Time:</label>
            <input type="datetime-local" id="borrowDatetime" />
            <div class="borrow-msg" id="borrowMsg"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeBorrowModal()">Cancel</button>
                <button class="btn-confirm" onclick="confirmBorrow()">Confirm</button>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/books.js"></script>
</body>
</html>
